<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Appointment Tracker</title>
<meta name="description" content="Track medical and other appointments for the whole family, sorted by what's next.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EFF2FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101526" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  color-scheme: light dark;
  --bg:#EFF2FA;
  --surface:#FFFFFF;
  --ink:#191F35;
  --muted:#5B6580;
  --line:#DADFEC;
  --ring:#8C97B5;
  --ok:#0A7360;
  --ok-bg:#E1F2EE;
  --warn:#8F5200;
  --warn-bar:#E39A12;
  --warn-bg:#FFF1D6;
  --bad:#B42A22;
  --bad-bg:#FBE4E1;
  --info:#2B55C9;
  --info-bg:#E4EBFC;
  --link:#2B55C9;
  --toast-action:#8FA6FF;
  --kid:#2B55C9;
  --prep-bg:#FFF1D6;
  --prep-ink:#8F5200;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101526;
    --surface:#181F36;
    --ink:#E8ECF7;
    --muted:#98A3C0;
    --line:#293250;
    --ring:#65719A;
    --ok:#3CCBA8;
    --ok-bg:#123229;
    --warn:#F2C065;
    --warn-bar:#F2C065;
    --warn-bg:#3A2D10;
    --bad:#FF8A80;
    --bad-bg:#3C1B19;
    --info:#8FB0FF;
    --info-bg:#1B2A55;
    --link:#8EA2FF;
    --toast-action:#3550D6;
    --prep-bg:#3A2D10;
    --prep-ink:#F2C065;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none !important}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

.wrap{
  max-width:560px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(130px + env(safe-area-inset-bottom,0px));
}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.when{color:var(--muted);font-size:15px;font-weight:600}
h1{margin:6px 0 0;font-size:clamp(30px,9vw,38px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.tools{display:flex;gap:4px;flex:none}
.iconbtn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:grid;place-items:center;padding:0;flex:none;
}
.iconbtn svg{width:22px;height:22px}
.linkbtn{background:none;border:0;padding:4px 0;min-height:32px;font-size:14px;font-weight:700;color:var(--link)}

.card{
  position:relative;overflow:hidden;margin-top:16px;padding:16px;background:var(--surface);
  border:1px solid var(--line);border-radius:22px;
}
.card h2{margin:0;font-size:19px;line-height:1.25;font-weight:750;letter-spacing:-.01em}
.card h2.attn{color:var(--warn)}
.card h2.good{color:var(--ok)}
.card .note{margin:4px 0 0;color:var(--muted);font-size:14px}
.nextrow{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.nextrow .avatar{flex:none}
.nextrow .txt{flex:1;min-width:0}
.nextrow b{display:block;font-size:16px;overflow-wrap:anywhere}
.nextrow span{font-size:14px;color:var(--muted)}

.search{
  width:100%;height:46px;margin-top:14px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:16px;
}
.kids{display:flex;gap:8px;overflow-x:auto;margin:10px -16px 0;padding:4px 16px 8px;scrollbar-width:none}
.kids::-webkit-scrollbar{display:none}
.kidchip{
  position:relative;flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 5px;
  border-radius:22px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;
}
.kidchip .avatar{width:34px;height:34px;font-size:15px}
.kidchip[aria-selected="true"]{background:var(--kid);border-color:var(--kid);color:#fff}
.kidchip[aria-selected="true"] .avatar{background:#fff;color:var(--kid)}
.kidchip.allchip{padding:0 16px}
.kidchip.allchip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kidchip .duedot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--warn-bar);border:2px solid var(--bg)}
.avatar{
  width:44px;height:44px;border-radius:50%;background:var(--kid);color:#fff;flex:none;
  display:grid;place-items:center;font-weight:800;font-size:18px;
}
.groupby{display:flex;align-items:center;gap:10px;margin-top:6px}
.groupby > span{font-size:13px;font-weight:700;color:var(--muted);flex:none}
.groupby .seg3{margin:0;flex:1}
.groupby .seg3 span{min-height:38px;font-size:14px}

.grouphead{margin:22px 4px 8px;font-size:14px;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.grouphead.g-today{color:var(--bad)}
.grouphead.g-tomorrow{color:var(--warn)}
.group{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{border-top:1px solid var(--line);box-shadow:inset 5px 0 0 var(--sc,var(--ring))}
.row:first-child{border-top:0}
.st-today{--sc:var(--bad)}
.st-tomorrow{--sc:var(--warn-bar)}
.st-week{--sc:var(--info)}
.st-later{--sc:var(--ring)}
.st-past{--sc:var(--ring);opacity:.68}
.st-cancelled{--sc:var(--ring);opacity:.55}
.rowbtn{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;
  min-height:76px;padding:11px 16px 11px 20px;background:none;border:0;text-align:left;
}
.rowbtn .date{width:52px;flex:none;text-align:center}
.rowbtn .date .dow{font-size:12px;font-weight:800;text-transform:uppercase;color:var(--muted)}
.rowbtn .date .dnum{font-size:22px;font-weight:800;line-height:1.1}
.st-today .date .dow,.st-today .date .dnum{color:var(--bad)}
.st-tomorrow .date .dow,.st-tomorrow .date .dnum{color:var(--warn)}
.name{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.name.strike{text-decoration:line-through;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.tag svg{width:14px;height:14px}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.owner i{width:10px;height:10px;border-radius:50%;background:var(--kid);display:inline-block}
.prepflag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--prep-ink);background:var(--prep-bg);padding:1px 8px;border-radius:999px;margin-top:3px}
.side{text-align:right;white-space:nowrap}
.rel{font-weight:800;font-size:14px}
.st-today .rel{color:var(--bad)}
.st-tomorrow .rel{color:var(--warn)}
.st-week .rel{color:var(--info)}
.tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:2px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--bad-bg);color:var(--bad)}

.empty{text-align:center;padding:36px 12px 8px}
.empty h2{margin:0 0 6px;font-size:22px;font-weight:750}
.empty p{margin:0 auto 18px;max-width:34ch;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-weight:650}
.pastsec{margin-top:26px}

.add{
  position:fixed;left:0;right:0;margin:0 auto;width:max-content;
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  height:56px;padding:0 24px 0 18px;border:0;border-radius:28px;white-space:nowrap;
  display:flex;align-items:center;gap:8px;font-weight:750;
  background:var(--ink);color:var(--bg);box-shadow:0 8px 22px rgba(8,14,32,.28);z-index:10;
}
.add svg{width:22px;height:22px}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,12,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));
  animation:up .2s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 4px;font-size:21px;font-weight:750;letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet .sub2{margin:0 0 14px;color:var(--muted);font-size:15px}
.field{display:block;margin-bottom:14px}
.lbl{display:block;font-size:14px;font-weight:650;margin-bottom:6px}
.lbl .opt{color:var(--muted);font-weight:500}
.hint{margin:0 0 10px;color:var(--muted);font-size:13px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel]{
  width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px;
}
textarea{
  width:100%;min-height:70px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:16px;resize:vertical;
}
input:focus,textarea:focus{border-color:var(--link)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.locrow{display:flex;gap:8px}
.locrow input{flex:1}
.locrow .iconbtn{flex:none}

.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.seg3.two{grid-template-columns:1fr 1fr}
.seg3.cols4{grid-template-columns:repeat(4,1fr)}
.seg3 label{position:relative;display:block}
.seg3 input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.seg3 span{
  display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 6px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:650;font-size:14px;text-align:center;
}
.seg3 input:checked+span{border-color:transparent;background:var(--ink);color:var(--bg)}
.seg3 input:focus-visible+span,.pickchip input:focus-visible+span{outline:3px solid var(--link);outline-offset:2px}
.pickchips{display:flex;flex-wrap:wrap;gap:8px}
.pickchip{position:relative;display:block}
.pickchip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pickchip span{
  display:flex;align-items:center;min-height:44px;padding:0 15px;border-radius:22px;
  border:1.5px solid var(--line);background:var(--bg);font-weight:650;font-size:15px;
}
.pickchip input:checked+span{background:var(--ink);color:var(--bg);border-color:transparent}
.customrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;margin-top:12px}
.customrow .btn{width:auto;padding:0 16px}
.tplrow{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:2px 20px 6px;scrollbar-width:none}
.tplrow::-webkit-scrollbar{display:none}
.tplrow .chip{flex:none;min-height:40px;padding:0 14px;font-size:14px;background:var(--bg)}

.prepbox{border-radius:14px;background:var(--prep-bg);padding:12px 14px;margin-bottom:14px}
.prepbox .lbl{color:var(--prep-ink)}
.prepbox textarea{background:var(--surface)}

.switchrow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:8px 0}
.switchrow b{font-weight:650}
.switchrow small{display:block;color:var(--muted);font-size:13px}
input.switch{
  -webkit-appearance:none;appearance:none;flex:none;position:relative;margin:0;
  width:52px;height:32px;border-radius:16px;border:0;background:var(--ring);transition:background .15s;
}
input.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:#fff;transition:transform .15s;
}
input.switch:checked{background:var(--link)}
input.switch:checked::after{transform:translateX(20px)}
details{margin:2px 0 14px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details[open] summary{margin-bottom:4px}
.btnrow{display:grid;gap:10px}
.btn{
  min-height:50px;width:100%;padding:0 18px;border-radius:14px;border:0;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.btn small{font-size:13px;font-weight:500;opacity:.85}
.btn.primary{background:var(--link);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.extras{margin-top:14px;padding-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch}
.textbtn{background:none;border:0;min-height:46px;padding:8px 4px;text-align:left;font-weight:650}
.textbtn.dangertext{color:var(--bad)}
.section{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.section h3{margin:0 0 10px;font-size:15px;font-weight:700}
.section p{margin:0 0 12px;color:var(--muted);font-size:14px}
.notice{padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px;font-weight:600}
.notice b{display:block;margin-bottom:2px}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.pillst{display:inline-block;margin:0 0 12px;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:800}
.pillst.st-today{background:var(--bad-bg);color:var(--bad)}
.pillst.st-tomorrow{background:var(--warn-bg);color:var(--warn)}
.pillst.st-week{background:var(--info-bg);color:var(--info)}
.pillst.st-later{background:var(--bg);color:var(--muted)}
.pillst.st-past{background:var(--bg);color:var(--muted)}
.pillst.st-cancelled{background:var(--bad-bg);color:var(--bad)}
.kv{margin:0 0 6px}
.kv div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv dt{font-size:13px;font-weight:700;color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv a{color:var(--link);font-weight:650}
.prepcall{border-radius:14px;background:var(--prep-bg);color:var(--prep-ink);padding:12px 14px;margin:14px 0;font-size:15px;overflow-wrap:anywhere}
.prepcall b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:3px}
.rlist{list-style:none;margin:0 0 6px;padding:0}
.rlist li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.rlist li:first-child{border-top:0}
.detailbtns{margin-top:14px}

.toast{
  position:fixed;left:0;right:0;margin:0 auto;width:max-content;z-index:30;
  bottom:calc(88px + env(safe-area-inset-bottom,0px));
  max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;
  padding:12px 14px 12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;
  box-shadow:0 8px 22px rgba(8,14,32,.3);
}
.toast button{background:none;border:0;padding:6px 4px;min-height:36px;font-weight:800;color:var(--toast-action)}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <div class="when" id="dateText"></div>
      <div class="tools">
        <button class="iconbtn" id="calBtn" type="button"></button>
        <button class="iconbtn" id="settingsBtn" type="button"></button>
      </div>
    </div>
    <h1 id="titleH"></h1>
  </header>
  <section id="summary" aria-live="polite"></section>
  <section id="controls"></section>
  <main id="list"></main>
  <section class="pastsec" id="pastsec"></section>
</div>
<button class="add" id="addBtn" type="button"></button>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var KEY = 'apptTracker.v1';
  var CATS = ['gp', 'dentist', 'eye', 'specialist', 'vaccination', 'lab', 'therapy', 'other'];
  var PRESET_LEADS = [1, 2, 3, 5, 7, 14, 30];   // days before
  var COLORS = ['#2B55C9', '#7B4BD1', '#C93585', '#BD5A0B', '#1B8552', '#0B7F8F'];
  var $ = function (s) { return document.querySelector(s); };
  var pad = function (n) { return String(n).padStart(2, '0'); };

  var ICON = {

    tune: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M20 7h0M4 12h4M14 12h6M4 17h10M20 17h0"/><circle cx="17" cy="7" r="2.2"/><circle cx="11" cy="12" r="2.2"/><circle cx="17" cy="17" r="2.2"/></g></svg>',
    cal: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></g></svg>',
    pin: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 105 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></g></svg>',
    phone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h3l1.5 4-2 1.5a11 11 0 005 5l1.5-2 4 1.5v3a1.5 1.5 0 01-1.6 1.5A16 16 0 015 6.1 1.5 1.5 0 016.5 4.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
    note: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l3 3V20a1 1 0 01-1 1H6a1 1 0 01-1-1V4.5a1 1 0 011-1z"/><path d="M9 11h6M9 15h6"/></g></svg>'
  };

  // tiny DOM builder (uses textContent, so anything typed by the user can never inject HTML)
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'value' || k === 'checked' || k === 'hidden') el[k] = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); return; }
    el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function plural(n, f) { var m10 = n % 10, m100 = n % 100; return n === 1 ? f[0] : (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) ? f[1] : f[2]; }

  /* ---------- text (English default / Polish) ---------- */
  var T = {
    en: {
      appName: 'Appointment Tracker', title: 'Appointments', addAppt: 'Add appointment', calAll: 'Add all to calendar',
      search: 'Search', searchPh: 'Search appointments…',
      headNone: 'Nothing coming up.',
      headNext: function (n) { return n === 1 ? '1 appointment coming up' : n + ' appointments coming up'; },
      next: 'Next up', allPeople: 'Everyone', general: 'General', peopleNav: 'People',
      groupBy: 'Group', gDate: 'Date', gPerson: 'Person', gType: 'Type',

  ];

  function lang() { return state.lang || 'en'; }   // defaults to English regardless of phone language; switch anytime in Settings
  function t(key, a, b) {
    var v = T[lang()][key];
    if (v === undefined) v = T.en[key];
    return typeof v === 'function' ? v(a, b) : v;
  }
  function locale() { return lang() === 'pl' ? 'pl-PL' : 'en-GB'; }

  /* ---------- dates ---------- */
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function isoToDate(iso) { var p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function dateToISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function shiftDay(iso, delta) { var d = isoToDate(iso); d.setDate(d.getDate() + delta); return dateToISO(d); }

  function fmtDate(iso, opts) { return isoToDate(iso).toLocaleDateString(locale(), opts || { day: 'numeric', month: 'short', year: 'numeric' }); }
  function dow3(iso) { return isoToDate(iso).toLocaleDateString(locale(), { weekday: 'short' }).replace('.', '').slice(0, 3); }
  function relText(days) {
    if (days === 0) return t('today');
    if (days === 1) return t('tomorrow');
    if (days === -1) return t('yesterday');
    return days > 0 ? t('inDays', days) : t('agoDays', -days);
  }
  function leadLabel(n) { return t('leadD', n); }

  /* ---------- data ---------- */
  // appts: { id, title, person, cat, date, time, location, phone, prep, notes, leads[], status:'open'|'cancelled', created, url? }
  function blank() { return { version: 1, lang: '', appts: [], settings: { leads: [1, 7], bg: false }, group: 'date' }; }

  function sanitize(d) {
    var out = blank();
    if (!d || typeof d !== 'object') return out;
    if (d.lang === 'pl' || d.lang === 'en') out.lang = d.lang;
    if (d.group === 'person' || d.group === 'type') out.group = d.group;
    var dre = /^\d{4}-\d{2}-\d{2}$/, tre = /^\d{2}:\d{2}$/;
    var cleanLeads = function (arr) { return (Array.isArray(arr) ? arr : []).filter(function (n, i, a) { return Number.isInteger(n) && n >= 1 && n <= 365 && a.indexOf(n) === i; }).sort(function (a, b) { return b - a; }); };
    var s = d.settings && typeof d.settings === 'object' ? d.settings : {};
    out.settings.leads = s.leads ? cleanLeads(s.leads) : [1, 7];
    out.settings.bg = s.bg === true;
    var ids = {};
    (Array.isArray(d.appts) ? d.appts : []).forEach(function (x) {
      if (!x || typeof x.id !== 'string' || typeof x.title !== 'string' || ids[x.id] || !dre.test(x.date)) return;
      ids[x.id] = true;
      out.appts.push({
        id: x.id, title: x.title.slice(0, 60), person: typeof x.person === 'string' ? x.person.trim().slice(0, 30) : '',
        cat: CATS.indexOf(x.cat) !== -1 ? x.cat : 'other', date: x.date, time: tre.test(x.time) ? x.time : '',
        location: typeof x.location === 'string' ? x.location.slice(0, 120) : '',
        phone: typeof x.phone === 'string' ? x.phone.slice(0, 30) : '',
        prep: typeof x.prep === 'string' ? x.prep.slice(0, 300) : '', notes: typeof x.notes === 'string' ? x.notes.slice(0, 500) : '',
        leads: cleanLeads(x.leads), status: x.status === 'cancelled' ? 'cancelled' : 'open',
        created: typeof x.created === 'number' ? x.created : 0
      });
    });
    return out;
  }

  var state = load();
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) return sanitize(JSON.parse(raw)); } catch (e) { /* fresh start */ }
    return blank();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast(t('tSaveFail')); }
    syncMirror();
  }

  var live = todayISO();
  var flt = { owner: '\u0000all', q: '' };
  var showPast = false;

  function findAppt(id) { return state.appts.filter(function (a) { return a.id === id; })[0]; }
  function okey(s) { return String(s || '').trim().toLowerCase(); }
  function ownerColor(name) {
    var k = okey(name), n = 0;
    for (var i = 0; i < k.length; i++) n = (n * 31 + k.charCodeAt(i)) >>> 0;
    return COLORS[n % COLORS.length];
  }
  function ownerLabels() {
    var map = {};
    state.appts.forEach(function (a) { if (a.person && !map[okey(a.person)]) map[okey(a.person)] = a.person; });
    return map;
  }
  function canonicalOwner(input) { var s = input.trim(); return ownerLabels()[okey(s)] || s; }

  function isPast(a) { return a.date < live; }

    if (isPast(a)) return 'past';
    var days = daysBetween(live, a.date);

    if (days === 1) return 'tomorrow';

    var hay = [a.title, a.person, a.location, a.notes, a.prep, t('c_' + a.cat)].join(' ').toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }

  function attentionCount() { return upcoming().filter(function (a) { var s = statusOf(a); return s === 'today' || s === 'tomorrow'; }).length; }

  }

    a.location = f.location; a.phone = f.phone; a.prep = f.prep; a.notes = f.notes; a.leads = f.leads.slice();
    return a;
  }

  /* ---------- rendering ---------- */
  function renderHeader() {
    $('#titleH').textContent = t('title');
    $('#dateText').textContent = isoToDate(live).toLocaleDateString(locale(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function renderSummary() {
    var box = $('#summary');
    box.replaceChildren();
    if (!state.appts.length) return;
    var list = upcoming().filter(function (a) { return ownerOk(a) && matches(a, flt.q); });
    var card = h('div', { class: 'card' },
      h('h2', { class: list.length ? 'attn' : 'good' }, list.length ? t('headNext', list.length) : t('headNone')));
    if (list.length) {
      var n = list[0];
      card.appendChild(h('div', { class: 'nextrow' },
        h('span', { class: 'avatar', style: '--kid:' + (n.person ? ownerColor(n.person) : 'var(--ring)') }, n.person ? Array.from(n.person)[0].toUpperCase() : '\u2013'),
        h('div', { class: 'txt' },
          h('b', null, n.title),
          h('span', null, [n.person, dow3(n.date) + ' ' + fmtDate(n.date, { day: 'numeric', month: 'short' }) + (n.time ? ', ' + n.time : ''), relText(daysBetween(live, n.date))].filter(Boolean).join(' \u00b7 ')))));
    }
    box.appendChild(card);
  }

  function renderControls() {
    var box = $('#controls');
    box.replaceChildren();
    if (!state.appts.length) return;
    var search = h('input', { type: 'search', class: 'search', placeholder: t('searchPh'), 'aria-label': t('search'), value: flt.q,
      oninput: function () { flt.q = search.value; renderSummary(); renderList(); } });
    box.appendChild(search);

    var labels = ownerLabels(), keys = Object.keys(labels).sort(function (a, b) { return labels[a].localeCompare(labels[b]); });
    var hasGeneral = state.appts.some(function (a) { return !a.person; });
    if (keys.length) {
      var needs = {};
      upcoming().forEach(function (a) { var s = statusOf(a); if (s === 'today' || s === 'tomorrow') needs[okey(a.person)] = true; });
      var nav = h('nav', { class: 'kids', role: 'tablist', 'aria-label': t('peopleNav') });

          'aria-selected': sel ? 'true' : 'false', 'aria-label': t('aShow') + label,

          isAll ? null : h('span', { class: 'avatar', style: '--kid:' + color }, Array.from(label)[0].toUpperCase()),

    var set = function (k) { node.textContent = t(k); };
    if (!('serviceWorker' in navigator) || !('PeriodicSyncManager' in window)) { set('bgUnsupported'); return; }
    if (!state.settings.bg) { node.textContent = ''; return; }
    if (!navigator.permissions) { set('bgNeedInstall'); return; }
    navigator.permissions.query({ name: 'periodic-background-sync' }).then(function (p) {
      if (p.state === 'granted') set('bgActive'); else if (p.state === 'denied') set('bgDenied'); else set('bgNeedInstall');
    }).catch(function () { set('bgNeedInstall'); });
  }

  /* ---------- settings ---------- */
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });
  window.addEventListener('appinstalled', function () { deferredInstall = null; toast(t('installed')); });

  function segmented(name, options, current, extraClass, onchange) {
    var wrap = h('div', { class: 'seg3' + (extraClass ? ' ' + extraClass : ''), role: 'radiogroup' });
    options.forEach(function (o) {
      var r = h('input', { type: 'radio', name: name, value: o.value, checked: o.value === current });
      if (onchange) r.addEventListener('change', function () { onchange(o.value); });
      wrap.appendChild(h('label', null, r, h('span', null, o.label)));
    });
    return wrap;
  }

  function settingsSheet() {
    var langSeg = segmented('lang', [{ value: 'en', label: 'English' }, { value: 'pl', label: 'Polski' }], lang(), 'two', function (v) {
      state.lang = v; save(); applyLang(); render(); settingsSheet();
    });
    var defPicker = leadPicker(state.settings.leads, function (arr) { state.settings.leads = arr.sort(function (a, b) { return b - a; }); save(); });
    var bgI = h('input', { type: 'checkbox', class: 'switch', role: 'switch', checked: state.settings.bg, onchange: function () { state.settings.bg = bgI.checked; save(); setupBackground(); bgStatus(bgNote); } });
    var bgNote = h('p', { style: 'margin-top:6px' });
    bgStatus(bgNote);
    var notifState = typeof Notification === 'undefined' ? 'none' : Notification.permission;
    var notifNode = notifState === 'granted' ? h('p', null, t('notifAllowed'))
      : notifState === 'denied' ? h('p', null, t('notifBlocked'))
      : notifState === 'none' ? h('p', null, t('notifNone'))
      : button('ghost', t('notifAsk'), function () { Notification.requestPermission().then(function () { settingsSheet(); }); });
    var fileI = h('input', { type: 'file', accept: 'application/json,.json', class: 'vis', tabindex: '-1', 'aria-hidden': 'true',
      onchange: function () { importFile(fileI.files[0]); fileI.value = ''; } });

    openSheet(t('settingsTitle'), null, [
      h('div', { class: 'field' }, h('span', { class: 'lbl' }, t('language')), langSeg),
      h('div', { class: 'section' }, h('h3', null, t('defTitle')), h('p', null, t('defText')), defPicker.node),
      h('div', { class: 'section' }, h('h3', null, t('calTitle')), h('p', null, t('calText')), button('primary', t('calBtn'), function () { exportCalendar(state.appts); })),
      h('div', { class: 'section' }, h('h3', null, t('bgTitle')),
        h('label', { class: 'switchrow' }, h('span', null, h('b', null, t('bgToggle')), h('small', null, t('bgHint'))), bgI), bgNote,
        notifNode,
        h('div', { class: 'notice', style: 'margin-top:12px' }, h('b', null, t('limitsTitle')), t('limitsText'))),
      deferredInstall ? h('div', { class: 'section' }, h('h3', null, t('install')), h('p', null, t('installText')),
        button('primary', t('installBtn'), function () { var ev = deferredInstall; deferredInstall = null; closeSheet(); ev.prompt(); })) : null,
      h('div', { class: 'section' }, h('h3', null, t('backup')), h('p', null, t('backupText')),
        h('div', { class: 'btnrow' }, button('ghost', t('saveBackup'), exportData), button('ghost', t('restore'), function () { fileI.click(); }), fileI)),
      h('div', { class: 'section' }, h('h3', null, t('erase')), button('danger', t('eraseBtn'), eraseSheet)),
      h('div', { class: 'btnrow', style: 'margin-top:22px' }, button('ghost', t('close'), closeSheet))
    ]);
  }

  function eraseSheet() {
    openSheet(t('eraseTitle'), t('eraseText'), [
      h('div', { class: 'btnrow' },
        button('danger', t('eraseGo'), function () {
          var keepLang = state.lang; state = blank(); state.lang = keepLang; save(); flt = { owner: '\u0000all', q: '' }; closeSheet(); render(); toast(t('erased'));
        }),
        button('ghost', t('cancel'), closeSheet))
    ]);
  }

  function exportData() {
    var payload = Object.assign({ app: 'apptTracker' }, state);
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: 'appointment-tracker-backup-' + todayISO() + '.json' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast(t('backupDone'));
  }

  function importFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var data = null;
      try {
        var parsed = JSON.parse(reader.result);
        if (parsed && parsed.app === 'apptTracker' && Array.isArray(parsed.appts)) data = sanitize(parsed);
      } catch (e) { data = null; }
      if (!data) { toast(t('badFile')); return; }
      openSheet(t('restoreTitle'), t('restoreText', data.appts.length), [
        h('div', { class: 'btnrow' },
          button('primary', t('restoreGo'), function () {
            state = data; save(); flt = { owner: '\u0000all', q: '' }; closeSheet(); applyLang(); render(); setupBackground(); toast(t('restored'));
          }),
          button('ghost', t('cancel'), closeSheet))
      ]);
    };
    reader.onerror = function () { toast(t('readFail')); };
    reader.readAsText(file);
  }

  /* ---------- wiring ---------- */
  $('#settingsBtn').innerHTML = ICON.tune;
  $('#calBtn').innerHTML = ICON.cal;
  $('#addBtn').addEventListener('click', function () { apptSheet(null); });
  $('#settingsBtn').addEventListener('click', settingsSheet);
  $('#calBtn').addEventListener('click', function () { exportCalendar(state.appts); });

  function checkNewDay() {
    var now = todayISO();
    if (now === live) return;
    live = now;
    render(); syncMirror();
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { checkNewDay(); syncMirror(); } });
  setInterval(checkNewDay, 60000);

  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  applyLang();
  render();
  syncMirror();
  setupBackground();
})();
</script>
</body>
</html>
